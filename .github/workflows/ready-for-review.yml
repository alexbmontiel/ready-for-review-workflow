name: Ready for review check
# Reusable workflow, shared across project repos (lifestyle, homeassistant,
# and this repo itself). See policies/review-and-handoff.md for the marker
# convention this depends on, and DESIGN.md's "deterministic hook" section
# for why this exists: an agent should never be the one deciding when to
# flip its own PR from draft to ready. This does that decision instead,
# based only on things it can verify itself.
#
# Also keeps the Linear issue(s) a PR references in sync with the PR's
# lifecycle, deterministically rather than relying on an agent to
# remember: "In Progress" when the PR opens, "In Review" (plus a
# specific assignee, if configured) when the PR is flipped ready. See
# scripts/linear_issue_transition.py. This part is best-effort - a
# Linear API hiccup never blocks the actual PR mechanics above.
#
# A project repo calls this with a small workflow of its own - see
# .github/workflows-templates/ready-for-review-caller.yml in this repo for
# the exact file to copy in.

on:
  workflow_call:
    secrets:
      READY_FOR_REVIEW_PAT:
        required: true
        description: >
          A fine-grained PAT with Pull requests: Read and write on this repo.
          Required because GITHUB_TOKEN is documented to be blocked from the
          markPullRequestReadyForReview mutation ("Resource not accessible
          by integration") - confirmed by hitting that error directly while
          building this, not a theoretical concern.
      LINEAR_API_KEY:
        required: false
        description: >
          A Linear Personal API key, scoped to the workspace this repo's
          issues live in. Optional - if unset, the Linear-sync steps are
          skipped entirely and only the GitHub-side ready-for-review
          mechanics run.
    inputs:
      linear_reviewer_id:
        type: string
        required: false
        description: >
          Linear user ID to assign an issue to when its PR flips to ready
          for review. Optional - if unset, the issue's assignee is left
          untouched.

permissions:
  pull-requests: write
  checks: read
  contents: read

jobs:
  sync-linear-on-open:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    env:
      # `secrets` isn't a valid context in `if:` expressions (confirmed via
      # actionlint - not just undocumented, actively rejected). Route it
      # through `env` instead, which is allowed there, so the sync step
      # below can check presence without a workaround script.
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - name: Checkout (for the transition script)
        if: env.LINEAR_API_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: alexbmontiel/ready-for-review-workflow
          sparse-checkout: scripts
      - name: Move referenced issue(s) to In Progress
        if: env.LINEAR_API_KEY != ''
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          identifiers=$(python3 -c "
          import os, re
          body = os.environ.get('PR_BODY') or ''
          pattern = r'(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*([A-Z][A-Z0-9]*-\d+)'
          for m in dict.fromkeys(re.findall(pattern, body)):
              print(m)
          ")
          if [ -z "$identifiers" ]; then
            echo "No Linear issue reference found in PR body - nothing to sync."
            exit 0
          fi
          args=()
          while IFS= read -r id; do args+=(--identifier "$id"); done <<< "$identifiers"
          python3 scripts/linear_issue_transition.py "${args[@]}" --to-state "In Progress" || \
            echo "::warning::Linear sync (In Progress) failed - continuing, this never blocks the PR."

  check-and-flip:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - name: Resolve the PR number for this event
        id: pr
        env:
          GH_TOKEN: ${{ secrets.READY_FOR_REVIEW_PAT }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
          else
            # check_suite: find the open PR(s) for this head SHA.
            sha="${{ github.event.check_suite.head_sha }}"
            number=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -z "${number:-}" ]; then
            echo "No associated PR found for this event - nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate and flip to ready if conditions are met
        id: flip
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.READY_FOR_REVIEW_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          pr_json=$(gh pr view "$PR_NUMBER" --json isDraft,body,headRefOid)
          is_draft=$(echo "$pr_json" | jq -r '.isDraft')
          body=$(echo "$pr_json" | jq -r '.body')
          sha=$(echo "$pr_json" | jq -r '.headRefOid')

          if [ "$is_draft" != "true" ]; then
            echo "Already ready for review - nothing to do."
            echo "flipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "$body" | grep -qF '<!-- independent-review: passed -->'; then
            echo "No independent-review marker yet - staying draft."
            echo "flipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If this commit has check runs, every one of them must have
          # concluded successfully (or neutral/skipped). No check runs at
          # all is not a failure - plenty of PRs (docs-only, this repo
          # before it has CI) legitimately have none. Exclude this job's
          # own check run - it's still in_progress while this script is
          # running, which would otherwise make it wait on itself forever.
          #
          # Poll for pending checks instead of exiting and relying on a
          # later re-trigger: this used to depend on `check_suite:
          # completed` to re-evaluate once other checks finished, but that
          # never actually worked - GitHub does not fire check_suite events
          # for suites created by GitHub Actions itself (anti-loop
          # protection), and nearly every check here is a GitHub Actions
          # workflow. Confirmed by hitting it directly: a PR whose marker
          # landed while a check was still running stayed in draft forever,
          # no event ever came to re-check it. Polling within this same job
          # run is the only thing that's actually been verified to work.
          poll_interval=20
          max_wait=600
          elapsed=0
          while :; do
            check_runs=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.name | endswith("check-and-flip") | not)]')
            bad=$(echo "$check_runs" | jq '[.[] | select(.conclusion != null and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped") | not)] | length')
            pending=$(echo "$check_runs" | jq '[.[] | select(.status != "completed")] | length')

            if [ "$bad" -gt 0 ]; then
              break
            fi
            if [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$elapsed" -ge "$max_wait" ]; then
              echo "Checks still pending after ${max_wait}s - giving up for this run. Staying draft; a new commit or PR edit will re-evaluate."
              echo "flipped=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Checks still running (${elapsed}s elapsed) - waiting ${poll_interval}s and re-checking..."
            sleep "$poll_interval"
            elapsed=$((elapsed + poll_interval))
          done

          if [ "$bad" -gt 0 ]; then
            echo "One or more checks did not pass - staying draft."
            echo "flipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Marker present, checks clean: marking ready for review."
          gh pr ready "$PR_NUMBER"
          echo "body=$body" >> "$GITHUB_OUTPUT"
          echo "flipped=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (for the transition script)
        if: steps.flip.outputs.flipped == 'true' && env.LINEAR_API_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: alexbmontiel/ready-for-review-workflow
          sparse-checkout: scripts

      - name: Move referenced issue(s) to In Review
        if: steps.flip.outputs.flipped == 'true' && env.LINEAR_API_KEY != ''
        env:
          PR_BODY: ${{ steps.flip.outputs.body }}
          REVIEWER_ID: ${{ inputs.linear_reviewer_id }}
        run: |
          set -euo pipefail
          identifiers=$(python3 -c "
          import os, re
          body = os.environ.get('PR_BODY') or ''
          pattern = r'(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*([A-Z][A-Z0-9]*-\d+)'
          for m in dict.fromkeys(re.findall(pattern, body)):
              print(m)
          ")
          if [ -z "$identifiers" ]; then
            echo "No Linear issue reference found in PR body - nothing to sync."
            exit 0
          fi
          args=()
          while IFS= read -r id; do args+=(--identifier "$id"); done <<< "$identifiers"
          if [ -n "${REVIEWER_ID:-}" ]; then
            args+=(--assignee-id "$REVIEWER_ID")
          fi
          python3 scripts/linear_issue_transition.py "${args[@]}" --to-state "In Review" || \
            echo "::warning::Linear sync (In Review) failed - continuing, the PR is still ready."
